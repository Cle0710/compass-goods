<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>コンパスグッズ管理</title>

<style>
#hero-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.hero-button{
  padding:16px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
  background:white;
}

#all-heroes-button{
  width:100%;
  padding:14px;
  font-size:18px;
  font-weight:bold;
  border-radius:8px;
  border:1px solid #ccc;
  background:white;
  color:black;
  margin-bottom:10px;
}

.selected-hero{
  background:#ff9800;
  color:white;
  font-weight:bold;
}

#all-heroes-button.selected-hero{
  background:#ff9800;
  color:white;
}

</style>

</head>
<body>

<h1>コンパスグッズ管理</h1>

<details>

  <summary>ヒーローで探す</summary>

  <button
    id="all-heroes-button"
    class="selected-hero"
    onclick="showAllHeroes()"
  >
    全ヒーロー
  </button>

  <div id="hero-list"></div>

</details>

<hr>

<details open>

  <summary>シリーズ情報</summary>

  <h2 id="series-name"></h2>

  <p>発売日: <span id="release-date"></span></p>
  <p>価格: <span id="price"></span>円</p>
  <p>商品コード: <span id="jan-code"></span></p>
</details>

<hr>

<h2>グッズ一覧</h2>

<p id="selected-hero">
全ヒーロー表示中
</p>

<p id="goods-count">
0件
</p>

<div id="goods-list"></div>

<hr>

<h2>グッズ詳細</h2>

<div id="goods-detail">
グッズを選択してください
</div>

<script src="goods.js"></script>
<script src="app.js"></script>

</body>
</html>
